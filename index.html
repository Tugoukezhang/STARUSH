<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1118'/%3E%3Cpath d='M32 8l5.9 17.3H56L41.4 36l5.8 17.4L32 42.6 16.8 53.4 22.6 36 8 25.3h18.1L32 8z' fill='%23d4af77'/%3E%3C/svg%3E" />
  <title>ST☆RUSH - 偶像舞台应援行动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #07080d;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 375px; height: 667px; }
    #hud {
      position: absolute; inset: 0; z-index: 12; pointer-events: none;
    }
    .cw-objective {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 268px; height: 64px; padding: 14px 28px 10px;
      background: url('art/hud/objective-plaque.jpg') center / 100% 100% no-repeat;
      border: none;
      box-shadow: none;
    }
    .cw-objective-kicker {
      text-align: center; color: #f8e7c3; font-size: 12px; font-weight: 800;
      letter-spacing: .04em; text-shadow: 0 1px 2px #000;
    }
    .cw-objective-row {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      margin-top: 2px;
    }
    #wave-text { color: #ffffff; font-size: 13px; font-weight: 800; }
    #round-clock {
      color: #e8d19a; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 700;
    }
    .mihoyo-player {
      position: absolute; top: 74px; left: 8px;
      display: flex; align-items: center; gap: 6px;
      padding: 0;
      background: none;
      border: none;
    }
    .mihoyo-portrait, .cw-portrait {
      width: 52px; height: 52px; border-radius: 50%;
      border: none;
      background: url('art/hud/sakura-avatar.jpg') center top / cover no-repeat;
      box-shadow: none;
      flex-shrink: 0;
    }
    .mihoyo-player-meta { display: flex; flex-direction: column; gap: 3px; min-width: 78px; }
    .mihoyo-name { color: #f8e7c3; font-size: 12px; font-weight: 700; }
    .hp-track {
      height: 16px; width: 92px;
      background: url('art/hud/hp-frame.jpg') center / 100% 100% no-repeat;
      border: none;
      overflow: hidden;
      position: relative;
    }
    #hp-fill {
      position: absolute; left: 8px; top: 4px; bottom: 4px;
      width: calc(100% - 16px);
      background: linear-gradient(90deg, #7adf7a, #3fae4a);
      border-radius: 8px;
    }
    #hp-bar { display: none; }
    .heat-card {
      position: absolute; top: 74px; right: 46px;
      min-width: 108px; padding: 8px 10px 8px;
      background: url('art/hud/objective-plaque.jpg') center / 140% 180% no-repeat;
      border: none;
    }
    #heat-level { display: block; color: #d4af77; font-size: 10px; margin-bottom: 3px; }
    #heat-gauge, #support-gauge {
      height: 6px; width: 100%;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      border: 1px solid rgba(212,175,119,.28);
    }
    #heat-fill, #support-gauge-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #7ad7c4, #d4af77);
    }
    #support-gauge { margin-top: 3px; }
    .mihoyo-skills {
      position: absolute; right: 10px; bottom: 78px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .skill-orb {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #2A1C0C;
      background: url('art/hud/skill-disc.jpg') center / cover no-repeat;
      border: none;
      box-shadow: 0 8px 14px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .skill-orb.ult {
      width: 64px; height: 64px; opacity: .8;
      background: url('art/hud/burst-orb.jpg') center / cover no-repeat;
      pointer-events: auto;
      color: #2A1C0C;
    }
    .skill-orb.ult.ready {
      opacity: 1;
      box-shadow: 0 0 18px rgba(212,175,119,.7);
    }
    .skill-orb.special {
      width: 52px; height: 52px;
      background: url('art/hud/special-disc.jpg') center / cover no-repeat;
      pointer-events: auto;
      position: relative;
      overflow: hidden;
      color: #2A1C0C;
    }
    .skill-orb.special.ready {
      box-shadow: 0 0 16px rgba(255, 214, 90, .8);
    }
    #special-fill {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 0%;
      background: rgba(255, 214, 90, .45);
      pointer-events: none;
    }
    .switch-roster {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: auto;
    }
    .switch-idol {
      width: 44px; height: 44px; border-radius: 50%;
      padding: 0; margin: 0; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      border: 3px solid rgba(212,175,119,.45);
      background-color: #141820;
      background-position: center 18%;
      background-size: cover;
      background-repeat: no-repeat;
      box-shadow: 0 4px 10px rgba(0,0,0,.4);
      opacity: .78;
    }
    .switch-idol[data-id="sakura"] { background-image: url('art/hud/sakura-avatar.jpg'); }
    .switch-idol[data-id="kai"] { background-image: url('art/hud/kai-avatar.jpg'); }
    .switch-idol[data-id="venus"] { background-image: url('art/hud/venus-avatar.jpg'); }
    .switch-idol.active {
      opacity: 1;
      border-color: #ffd76a;
      box-shadow: 0 0 12px rgba(255, 215, 106, .7);
      transform: scale(1.08);
    }
    .atmosphere-bar, #form-display { display: none !important; }
    #combo-display, #encore-indicator, #center-stage-indicator {
      position: absolute; left: 50%; transform: translateX(-50%);
      pointer-events: none; z-index: 14; opacity: 0;
      color: #f8e7c3; font-weight: 700; letter-spacing: .12em;
      text-shadow: 0 2px 0 #3a2a12, 0 0 12px rgba(212,175,119,.55);
    }
    #combo-display { top: 108px; font-size: 15px; }
    #encore-indicator { top: 136px; font-size: 20px; }
    #center-stage-indicator { top: 164px; font-size: 16px; }
    #support-text { display: none; }
    #ult-prompt {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 22;
      pointer-events: auto;
      background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.45));
    }
    #ult-prompt.show { display: block; }
    #ult-prompt img {
      position: absolute;
      right: -8px;
      top: 72px;
      height: 420px;
      pointer-events: none;
    }
    #ult-prompt .ult-call {
      position: absolute;
      left: 18px;
      top: 292px;
      color: #fff8e8;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .08em;
      text-shadow: 0 3px 0 #c43a7a, 0 0 16px #ff6fae;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BqBlx2QU.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="hud" style="display:none">
      <div class="cw-objective">
        <div class="cw-objective-kicker">公演目标</div>
        <div class="cw-objective-row">
          <span id="wave-text">点亮所有指定! 0/86</span>
          <span id="round-clock">03:00</span>
        </div>
      </div>
      <div class="mihoyo-player">
        <div class="mihoyo-portrait cw-portrait" aria-hidden="true"></div>
        <div class="mihoyo-player-meta">
          <div class="mihoyo-name">绯樱</div>
          <div class="hp-track"><div id="hp-fill"></div></div>
          <div id="hp-bar">
            <div class="hp-pip" id="hp-1"></div>
            <div class="hp-pip" id="hp-2"></div>
            <div class="hp-pip" id="hp-3"></div>
            <div class="hp-pip" id="hp-4"></div>
            <div class="hp-pip" id="hp-5"></div>
          </div>
        </div>
      </div>
      <div class="heat-card">
        <span id="heat-level">应援等级 Lv.1</span>
        <div id="heat-gauge"><div id="heat-fill"></div></div>
        <div id="support-gauge"><div id="support-gauge-fill"></div></div>
      </div>
      <div class="mihoyo-skills">
        <div class="skill-orb ult" id="skill-encore">安可</div>
        <div class="skill-orb special" id="skill-special">应援<div id="special-fill"></div></div>
        <div class="switch-roster">
          <button type="button" class="switch-idol active" data-id="sakura" aria-label="绯樱"></button>
          <button type="button" class="switch-idol" data-id="kai" aria-label="苍海"></button>
          <button type="button" class="switch-idol" data-id="venus" aria-label="金星"></button>
        </div>
      </div>
      <div class="atmosphere-bar">
        <div class="atmo-dot pink" id="atmo-pink"></div>
        <div class="atmo-dot blue" id="atmo-blue"></div>
        <div class="atmo-dot yellow" id="atmo-yellow"></div>
        <div class="atmo-dot purple" id="atmo-purple"></div>
        <div class="atmo-dot orange" id="atmo-orange"></div>
      </div>
      <span id="support-text">0</span>
    </div>
    <div id="ult-prompt">
      <img src="art/hud/encore-cutin.jpg" alt="" />
      <div class="ult-call">释放安可!</div>
    </div>
    <div id="combo-display" style="display:none"></div>
    <div id="encore-indicator" style="display:none">安可</div>
    <div id="center-stage-indicator" style="display:none">C位</div>
    <div id="form-display" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;">
      <span id="form-text">🎤 输出</span>
    </div>
  </div>
</body>
</html>
