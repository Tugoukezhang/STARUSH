  <title>ST☆RUSH - 偶像舞台应援行动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;

    #game-container {
      position: relative;
    }
    #hud {

      top: 0; left: 0; right: 0;
      padding: 10px 12px 8px;
      gap: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(6,8,18,0.92), rgba(6,8,18,0.55) 70%, transparent);
    }
    .hud-item {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 2px #000;
    }
    .atmosphere-bar {
      display: flex;
      gap: 5px;
    }
    .atmo-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.55);
      opacity: 0.45;
      transition: opacity 0.3s, box-shadow 0.3s;
    }
    .atmo-dot.active {
      opacity: 1;
      box-shadow: 0 0 8px currentColor;
    }
    .atmo-dot.pink { background: #FF69B4; color: #FF69B4; }
    .atmo-dot.blue { background: #00CED1; color: #00CED1; }
    .atmo-dot.yellow { background: #FFD700; color: #FFD700; }
    .atmo-dot.purple { background: #9370DB; color: #9370DB; }
    .atmo-dot.orange { background: #FF8C00; color: #FF8C00; }
    #support-gauge {
      width: 100px; height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    #support-gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FF69B4, #FFD700);
      border-radius: 4px;
      transition: width 0.2s;
    }
    #combo-display {
      position: absolute;
      top: 54px; right: 14px;
      color: #FFD700;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #encore-indicator {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      color: #FFB347;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
    }
    #center-stage-indicator {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #FFC2DC;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
    }

<body>

    <div id="combo-display" style="display:none"></div>

    <div id="form-display" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;z-index:10;">
