<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q86 粉发蓝白源层检查</title><style>*{box-sizing:border-box}body{margin:0;background:#19232c;color:#ecf2ed;font:14px system-ui}header{padding:12px;background:#233942}h1{font-size:19px;margin:0 0 6px}button,select,input{font:inherit}button{padding:7px;margin:3px;border:1px solid #86b5a3;border-radius:5px;background:#2f4e51;color:white}main{display:grid;grid-template-columns:minmax(280px,1fr) 310px;gap:10px;padding:10px}.stage{position:relative;aspect-ratio:1085/1450;max-height:calc(100vh - 130px);background:#444;margin:auto;width:100%;max-width:720px}.stage svg{width:100%;height:100%;display:block}.stage>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{max-height:80vh;overflow:auto;padding:8px;background:#23323a}.row{padding:4px;border-bottom:1px solid #425758;display:flex;align-items:center;gap:4px}.row button{font-size:12px;padding:3px}.row label{flex:1}.control{margin:8px 0}.control label{display:block;margin:5px 0}.control select{max-width:100%}.controls{min-width:0}output{display:block;color:#9de3c6}small{color:#c8b39b}@media(max-width:650px){main{display:block}.stage{max-height:none}.controls{max-height:400px}header{font-size:12px}}</style><header><h1>粉发蓝白立绘 · Q86 源层检查</h1><strong id="renderer-label">正在核对导出层…</strong><br><span id="layer-count">0</span> 个源层；<span id="acceptance">读取验收状态…</span> 无网格绑定或物理。<small>参考：用户正式 PNG 的透明衍生稿，非原始字节。</small></header><main><section><div class="stage" id="stage"></div></section><aside class="controls"><button id="reset">全部复位</button><button id="renderer">查看SVG诊断</button><button id="source">原衍生图对照</button><label>背景<select id="bg"><option value="#444">灰</option><option value="#fff">白</option><option value="#182c38">深蓝</option></select></label><div class="control"><label>当前层 <select id="selected"></select></label><label>X <input id="dx" type="range" min="-30" max="30" value="0"></label><label>Y <input id="dy" type="range" min="-30" max="30" value="0"></label><output id="status"></output></div><div id="list"></div></aside></main><script type="module" src="source-review.mjs"></script></html>
