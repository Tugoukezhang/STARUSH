<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q78 绿发源层检查</title><style>*{box-sizing:border-box}body{margin:0;background:#19232c;color:#ecf2ed;font:14px system-ui}header{padding:12px;background:#233942}h1{font-size:19px;margin:0 0 6px}button,select,input{font:inherit}button{padding:7px;margin:3px;border:1px solid #86b5a3;border-radius:5px;background:#2f4e51;color:white}main{display:grid;grid-template-columns:minmax(280px,1fr) 310px;gap:10px;padding:10px}.stage{position:relative;aspect-ratio:1086/1448;max-height:calc(100vh - 130px);background:#444;margin:auto;width:100%;max-width:720px}.stage svg{width:100%;height:100%;display:block}.stage>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{max-height:80vh;overflow:auto;padding:8px;background:#23323a}.row{padding:4px;border-bottom:1px solid #425758;display:flex;align-items:center;gap:4px}.row button{font-size:12px;padding:3px}.row label{flex:1}.control{margin:8px 0}.control label{display:block;margin:5px 0}.control select{max-width:100%}.controls{min-width:0}output{display:block;color:#9de3c6}small{color:#c8b39b}@media(max-width:650px){main{display:block}.stage{max-height:none}.controls{max-height:400px}header{font-size:12px}}</style><header><h1>绿发立绘 · Q78 源层检查</h1>38 个候选层；未通过拆层验收，无网格绑定或物理。<small>参考：用户正式 PNG 的透明衍生稿，非原始字节。</small></header><main><section><div class="stage" id="stage"></div></section><aside class="controls"><button id="reset">全部复位</button><button id="source">原衍生图对照</button><label>背景<select id="bg"><option value="#444">灰</option><option value="#fff">白</option><option value="#182c38">深蓝</option></select></label><div class="control"><label>当前层 <select id="selected"></select></label><label>X <input id="dx" type="range" min="-30" max="30" value="0"></label><label>Y <input id="dy" type="range" min="-30" max="30" value="0"></label><output id="status"></output></div><div id="list"></div></aside></main><script type="module">
const m=await (await fetch('layers.json')).json(),stage=document.querySelector('#stage');stage.innerHTML=await(await fetch('green-layer-source.svg')).text();const svg=stage.querySelector('svg'),selected=document.querySelector('#selected'),list=document.querySelector('#list'),status=document.querySelector('#status'),dx=document.querySelector('#dx'),dy=document.querySelector('#dy');
document.querySelector('#layer-count').textContent=m.layers.length;
const initial=new Map(m.layers.map(l=>[l.id,l.visible!==false]));const shifts=new Map();
for(const l of [...m.layers].reverse()){const o=document.createElement('option');o.value=l.id;o.textContent=l.label;selected.append(o);const row=document.createElement('div');row.className='row';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.dataset.layer=l.id;check.checked=initial.get(l.id);label.append(check,document.createTextNode(l.label));const solo=document.createElement('button');solo.textContent='单层';solo.dataset.solo=l.id;solo.onclick=()=>{for(const c of list.querySelectorAll('input')){c.checked=c.dataset.layer===l.id;svg.getElementById(c.dataset.layer).style.display=c.checked?'':'none'}selected.value=l.id;refresh()};check.onchange=()=>{svg.getElementById(l.id).style.display=check.checked?'':'none';refresh()};row.append(label,solo);list.append(row)}
function refresh(){const v=shifts.get(selected.value)||[0,0];dx.value=v[0];dy.value=v[1];status.textContent=selected.value+' / '+v.join(', ')+' px；平移仅检查遮挡，不代表转向绑定'}
selected.onchange=refresh;for(const s of[dx,dy])s.oninput=()=>{const v=[+dx.value,+dy.value];shifts.set(selected.value,v);svg.getElementById(selected.value).setAttribute('transform',`translate(${v})`);refresh()};
document.querySelector('#reset').onclick=()=>{shifts.clear();for(const l of m.layers){svg.getElementById(l.id).removeAttribute('transform');svg.getElementById(l.id).style.display=initial.get(l.id)?'':'none';list.querySelector(`[data-layer="${l.id}"]`).checked=initial.get(l.id)}stage.querySelector('img')?.remove();svg.style.visibility='';refresh()};document.querySelector('#source').onclick=()=>{const old=stage.querySelector('img');if(old){old.remove();svg.style.visibility=''}else{svg.style.visibility='hidden';const i=document.createElement('img');i.src='cutout-candidate.png';i.alt='透明衍生图对照';stage.append(i)}};document.querySelector('#bg').onchange=e=>stage.style.background=e.target.value;refresh();window.q78Ready=true;
</script></html>
