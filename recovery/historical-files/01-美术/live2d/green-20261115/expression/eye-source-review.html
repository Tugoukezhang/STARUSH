<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q80 眼口表情源候选</title><style>body{background:#253139;color:#eee;font:16px system-ui;margin:12px}main{display:flex;flex-wrap:wrap;gap:18px}canvas{max-width:100%;height:auto;background:#e9e3dc}#full{width:360px}button,label{display:block;margin:8px}button{padding:10px}aside{max-width:340px}</style><h1>Q80 · 独立眼部源候选</h1><p>仅静态拆层与隐藏补绘；未通过表情验收，没有眨眼、注视、嘴形或物理绑定。</p><main><section><canvas id="head" width="600" height="520"></canvas><canvas id="full" width="1086" height="1448"></canvas></section><aside><button id="reset">全部复位</button><button id="compare">Q78 已验收中性源对照</button><div id="controls"></div><output id="status"></output></aside></main><script type="module">
const m=await(await fetch('eye-raster.json')).json(),base=await(await fetch('../raster-layers.json')).json();const cache=new Map();for(const l of [...m.layers,...base.layers])if(!cache.has(l.file)){const i=new Image();i.src='../'+l.file;await i.decode();cache.set(l.file,i)}const full=document.querySelector('#full'),head=document.querySelector('#head'),ctx=full.getContext('2d'),hx=head.getContext('2d'),disabled=new Set();let original=false;
function draw(){ctx.clearRect(0,0,1086,1448);for(const l of original?base.layers:m.layers)if(!disabled.has(l.id))ctx.drawImage(cache.get(l.file),l.x,l.y);hx.clearRect(0,0,600,520);hx.drawImage(full,465,210,150,130,0,0,600,520);document.querySelector('#status').textContent=original?'显示Q78原中性源':'显示Q80候选；83层中替换10个眼部层，无参数绑定'}
for(const l of m.layers.filter(l=>l.id.startsWith('eye-'))){const label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.dataset.layer=l.id;c.onchange=()=>{if(c.checked)disabled.delete(l.id);else disabled.add(l.id);draw()};label.append(c,document.createTextNode(l.id));document.querySelector('#controls').append(label)}document.querySelector('#reset').onclick=()=>{disabled.clear();original=false;document.querySelectorAll('input').forEach(c=>c.checked=true);draw()};document.querySelector('#compare').onclick=()=>{original=!original;draw()};draw();window.expressionReady=true;
</script></html>
