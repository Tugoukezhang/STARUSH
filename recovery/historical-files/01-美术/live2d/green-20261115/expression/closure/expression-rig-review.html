<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q80 绿发表情网格候选</title><style>body{margin:0;background:#17252a;color:#f4eee7;font:15px system-ui}main{display:grid;grid-template-columns:minmax(300px,1fr) 330px;max-width:1400px;margin:auto}#stage{height:88vh;min-height:400px;background:#e9e3dc}canvas{width:100%;height:100%;display:block}aside{padding:20px}label{display:block;margin:10px 0}input{width:100%;accent-color:#65c6af}output{float:right}button{padding:11px;margin:4px;background:#294c45;color:white;border:1px solid #91bdb2;border-radius:7px}small{line-height:1.5}#status{font-size:12px;line-height:1.6}@media(max-width:650px){main{display:block}#stage{height:50vh}aside{padding:14px}}</style><main><div id="stage"><canvas id="model"></canvas></div><aside><h1>绿发 · 眼口表情</h1><p><small>Q80 候选，尚未验收。真实 Inochi2D 分层网格，非 Cubism/moc3；未完成物理或游戏接入。</small></p><div id="controls"></div><button id="blink">眨眼一次</button><button id="respond">微笑回应</button><button id="reset">复位</button><button id="zoom">全身</button><button id="reload">重载模型</button><p id="status" role="status">正在加载…</p><a href="green-expression-rig.inx" download style="color:#9ce0cd">下载可编辑 INX</a></aside></main><script type="module">
import init,{Inochi2dRuntime} from '../../../vendor/inox2d/inochi2d.js';
const canvas=document.querySelector('canvas'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let runtime,bytes,gl,design,disposed=false,closeup=true,draws=0,frame=0,restore=null,state={};const specs=[['yaw','左右转向',-12,12],['pitch','俯仰',-8,8],['roll','倾斜',-4,4],['left','左眼闭合',0,1],['right','右眼闭合',0,1],['gx','注视左右',-1,1],['gy','注视上下',-1,1],['close','嘴部闭合',0,1],['smile','微笑变化',-1,1]];const inputs={};for(const[id,label,min,max]of specs){let el=document.createElement('label');el.append(document.createTextNode(label));let out=document.createElement('output'),s=document.createElement('input');s.id=id;s.type='range';s.min=min;s.max=max;s.step=id==='yaw'||id==='pitch'||id==='roll'?.1:.01;s.value=0;s.setAttribute('aria-label',label);el.append(out,s);document.querySelector('#controls').append(el);inputs[id]=s;state[id]=0;s.oninput=()=>{stopMotion();pose({[id]:+s.value});};}
function stopMotion(){cancelAnimationFrame(frame);frame=0;if(restore){const saved=restore;restore=null;pose(saved)}}
function animate(kind){stopMotion();restore={...state};const base={...state},start=performance.now(),duration=kind==='blink'?420:800;function step(now){const t=Math.min(1,(now-start)/duration),pulse=Math.sin(Math.PI*t)**2;if(kind==='blink')pose({left:base.left+(1-base.left)*pulse,right:base.right+(1-base.right)*pulse});else pose({smile:base.smile+(1-base.smile)*pulse,close:base.close+(.45-base.close)*pulse});if(t<1)frame=requestAnimationFrame(step);else stopMotion()}frame=requestAnimationFrame(step)}
function render(){if(runtime&&!disposed){runtime.tick(0);draws++}}
function resize(){if(!runtime||disposed)return;const {width,height}=stage.getBoundingClientRect();runtime.resize(width,height,Math.min(devicePixelRatio,2));runtime.set_camera_transform(closeup?8:0,closeup?454:0,closeup?Math.min(width/105,height/105):Math.min(width/1100,height/1500));render()}
function pose(values={}){state={...state,...values};for(const[id,s]of Object.entries(inputs)){s.value=state[id];s.previousElementSibling.value=Number(state[id]).toFixed(2)}runtime.set_parameter_vec2('Head:: Yaw-Pitch',state.yaw,state.pitch);runtime.set_parameter_scalar('Head:: Roll',state.roll);runtime.set_parameter_vec2('Eye:: Gaze',state.gx,state.gy);for(const[name,id]of [['Eye:: Left Blink','left'],['Eye:: Right Blink','right'],['Mouth:: Close','close'],['Mouth:: Smile','smile']]){runtime.set_parameter_scalar(name,state[id]);for(const[axis,head]of [['Yaw','yaw'],['Pitch','pitch'],['Roll','roll']])runtime.set_parameter_vec2(name+' '+axis,state[head],state[id]);}for(const[side,id]of [['left','left'],['right','right']])for(const part of ['white','iris','highlight'])runtime.set_part_opacity_by_name('eye-'+side+'-'+part,Math.min(1,(1-state[id])*4));runtime.set_part_opacity_by_name('mouth-closed',Math.max(0,(state.close-.75)*4));for(const part of ['teeth','tongue','upper','lower','cavity'])runtime.set_part_opacity_by_name('mouth-'+part,Math.min(1,(1-state.close)*4));render();status.textContent=`${design.parts} 层 / ${design.parameters.length} 个原生参数（含组合修正） · 候选未验收`;}
try{gl=canvas.getContext('webgl2',{stencil:true});if(!gl)throw Error('WebGL2 不可用');const parameter=gl.texParameteri.bind(gl);gl.texParameteri=(t,n,v)=>parameter(t,n,v===0x812d?gl.CLAMP_TO_EDGE:v);await init({module_or_path:'../../../vendor/inox2d/inochi2d_bg.wasm'});runtime=new Inochi2dRuntime(canvas);bytes=new Uint8Array(await(await fetch('green-expression-rig.inx')).arrayBuffer());design=await(await fetch('expression-rig-design.json')).json();runtime.load_model(bytes);resize();pose();document.querySelector('#reset').onclick=()=>{stopMotion();pose(Object.fromEntries(specs.map(([id])=>[id,0])))};document.querySelector('#blink').onclick=()=>animate('blink');document.querySelector('#respond').onclick=()=>animate('smile');document.querySelector('#zoom').onclick=()=>{closeup=!closeup;document.querySelector('#zoom').textContent=closeup?'全身':'脸部特写';resize()};document.querySelector('#reload').onclick=()=>{stopMotion();runtime.clear();runtime.load_model(bytes);resize();document.querySelector('#reset').click()};const observer=new ResizeObserver(resize);observer.observe(stage);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMotion()});addEventListener('pagehide',()=>{stopMotion();observer.disconnect();runtime.clear();runtime.free();disposed=true},{once:true});window.expressionReview={pose,state:()=>({...state}),snapshot:()=>runtime.get_frame_snapshot_summary(),draws:()=>draws,animating:()=>!!frame,captureNative(){runtime.resize(1086,1448,1);runtime.set_camera_transform(0,0,1);render();const data=canvas.toDataURL();resize();return data}};window.ready=true;}catch(e){window.failure=String(e);status.textContent='加载失败：'+e.message;console.error(e)}
</script></html>
