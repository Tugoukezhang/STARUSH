<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q71 嘴部源素材候选</title><style>body{margin:20px;background:#18212c;color:#eee;font:16px system-ui}main{max-width:1000px;margin:auto}p{line-height:1.6}label,button{display:inline-block;margin:6px;padding:12px;background:#344151;color:white;border:1px solid #8996a5;border-radius:6px}canvas{width:100%;height:auto}a{color:#ffbb88}</style><main><h1>Q71 嘴部源素材候选</h1><p>64层源文件。下方开关仅检查五个独立嘴部图层；没有连续开闭口、表情参数或嘴部模型绑定，Q71尚未验收。</p><div id="controls"></div><button id="reset">恢复全部图层</button><button id="zoom">查看全身</button><p id="status" role="status">加载中</p><canvas></canvas><p><a href="red-mouth-source.psd" download>下载分层PSD</a> · <a href="red-mouth-source.ora" download>下载OpenRaster</a></p></main><script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),hidden=new Set();let closeup=true;
try{const response=await fetch('mouth-rig-raster.json');if(!response.ok)throw Error('清单读取失败');const data=await response.json(),layers=await Promise.all(data.layers.map(l=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve({...l,image:im});im.onerror=()=>reject(Error(l.file));im.src=l.file})));const source=document.createElement('canvas');source.width=1070;source.height=1470;const s=source.getContext('2d');
function draw(){s.clearRect(0,0,1070,1470);for(const l of layers)if(!hidden.has(l.id))s.drawImage(l.image,l.x,l.y);canvas.width=closeup?900:1070;canvas.height=closeup?750:1470;ctx.fillStyle='#e9e3dc';ctx.fillRect(0,0,canvas.width,canvas.height);if(closeup)ctx.drawImage(source,470,155,200,167,0,0,900,750);else ctx.drawImage(source,0,0);status.textContent=`${64-hidden.size}/64层可见 · 仅源素材候选`;}
const names=['口腔','上牙','舌','上唇','下唇'];data.mouthParts.forEach((l,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;input.dataset.part=l.id;input.onchange=()=>{input.checked?hidden.delete(l.id):hidden.add(l.id);draw()};label.append(input,names[i]);document.querySelector('#controls').append(label)});document.querySelector('#reset').onclick=()=>{hidden.clear();document.querySelectorAll('input').forEach(i=>i.checked=true);draw()};document.querySelector('#zoom').onclick=e=>{closeup=!closeup;e.target.textContent=closeup?'查看全身':'查看脸部';draw()};draw();window.mouthSourceReview={ready:true,capture:()=>source.toDataURL(),accepted:false};}catch(e){status.textContent='加载失败：'+e.message;console.error(e)}
</script></html>
