<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q73 发束源候选核对</title>
<style>body{background:#202732;color:#eee;font:15px system-ui;margin:20px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}svg{width:100%;background:#e9e3dc;border-radius:12px}label{display:inline-block;margin:12px}button{padding:10px}p{max-width:850px;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<h1>Q73 · 发束源候选核对</h1><p>左图为原马尾；右图仅按特征点估计位置叠合两张新补绘。尚未验收或纳入正式源／模型；重点检查左前景卷发与主束接缝、亮部连续及原轮廓，位置误差小不代表设计一致。</p>
<label><input id="main" type="checkbox" checked>主马尾补绘</label><label><input id="lock" type="checkbox" checked>独立左卷发</label><label>原轮廓叠加 <input id="overlay" type="range" min="0" max="1" step=".05" value="0"></label><button id="reset">复位</button>
<main><section><h2>原源</h2><svg viewBox="0 0 1070 730"><image href="rendered-layers/rear-hair.png" x="21" y="5" width="1033" height="705"/></svg></section><section><h2>未采用候选</h2><svg id="candidate" viewBox="0 0 1070 730"></svg></section></main><p id="status"></p>
<script type="module">
const ns='http://www.w3.org/2000/svg',svg=document.querySelector('#candidate'),proposal=await(await fetch('hair-source-proposal.json')).json(),layers={};
for(const id of ['main','lock']){const entry=proposal.candidates.find(c=>c.file.includes(id==='main'?'main-underpaint':'left-lock')),m=entry.generatedToOriginalLayer,node=document.createElementNS(ns,'image');node.setAttribute('href',entry.file);node.setAttribute('width',entry.dimensions[0]);node.setAttribute('height',entry.dimensions[1]);node.setAttribute('transform',`matrix(${m[0][0]} ${m[1][0]} ${m[0][1]} ${m[1][1]} ${m[0][2]+21} ${m[1][2]+5})`);svg.append(node);layers[id]=node;document.querySelector('#'+id).onchange=e=>node.style.display=e.target.checked?'':'none';}
const overlay=document.createElementNS(ns,'image');for(const[k,v]of Object.entries({href:'rendered-layers/rear-hair.png',x:21,y:5,width:1033,height:705,opacity:0}))overlay.setAttribute(k,v);svg.append(overlay);document.querySelector('#overlay').oninput=e=>overlay.setAttribute('opacity',e.target.value);
document.querySelector('#reset').onclick=()=>{for(const id of ['main','lock']){document.querySelector('#'+id).checked=true;layers[id].style.display=''}document.querySelector('#overlay').value=0;overlay.setAttribute('opacity',0)};
document.querySelector('#status').textContent=proposal.candidates.map(c=>`${c.file}：${c.inliers}个内点，中位误差${c.medianInlierError.toFixed(2)}px；未采用`).join(' / ');window.ready=true;
</script></html>
