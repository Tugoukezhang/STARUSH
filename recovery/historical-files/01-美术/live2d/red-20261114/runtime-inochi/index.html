<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>红发角色 · 运行包验收</title><style>*{box-sizing:border-box}body{margin:0;background:#1b2330;color:#f8eee7;font:16px system-ui}main{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 260px;min-height:100dvh}canvas{width:100%;height:95dvh;display:block;background:#e9e3dc;touch-action:none}aside{padding:20px}button{border:1px solid #958c8a;background:#323e50;color:inherit;border-radius:8px;padding:12px;margin:4px;font:inherit}small{line-height:1.6;display:block;color:#d7c8be}#status{min-height:3em}button:disabled{opacity:.5}@media(max-width:650px){main{grid-template-columns:1fr}canvas{height:65dvh}aside{padding:12px}}</style><main><canvas aria-label="红发角色预览"></canvas><aside><h1>红发 · 回应</h1><small>独立 Inochi2D 运行包候选<br>移动指针或拖动可改变注视。<br>尚未接入游戏主页。</small><p id="status" role="status">正在载入角色…</p><div id="actions"><button id="steady">提稳武器</button><button id="respond">抬手回应</button><button id="pause">暂停</button><button id="cancel">取消并回正</button><button id="reset">复位</button><button id="recreate">重建角色</button></div></aside></main><script type="module">
import {createRedAvatar}from'./avatar.mjs';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),buttons=[...document.querySelectorAll('button')];let avatar,loading=false,controller;
async function mount(){if(loading)return;loading=true;buttons.forEach(b=>b.disabled=true);avatar?.destroy();controller?.abort();controller=new AbortController();status.textContent='正在载入角色…';try{avatar=await createRedAvatar(canvas,{signal:controller.signal,onError:e=>{status.textContent=e.message}});window.avatar=avatar;status.textContent='角色已就绪';document.querySelector('#pause').textContent='暂停'}catch(e){status.textContent='载入失败：'+e.message;window.loadFailure=e.message}finally{loading=false;buttons.forEach(b=>b.disabled=!avatar||avatar.snapshot().disposed);document.querySelector('#recreate').disabled=false}}
for(const name of ['steady','respond'])document.querySelector('#'+name).onclick=()=>{avatar.play(name);document.querySelector('#pause').textContent='暂停'};
document.querySelector('#pause').onclick=()=>{if(avatar.snapshot().paused){avatar.resume();document.querySelector('#pause').textContent='暂停'}else{avatar.pause();document.querySelector('#pause').textContent='继续'}};
document.querySelector('#cancel').onclick=()=>{avatar.cancel();document.querySelector('#pause').textContent='暂停'};document.querySelector('#reset').onclick=()=>avatar.reset();document.querySelector('#recreate').onclick=mount;
canvas.addEventListener('pointermove',e=>{if(!avatar||loading)return;const r=canvas.getBoundingClientRect();avatar.look((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1)});canvas.addEventListener('pointerleave',()=>{if(avatar&&!loading)avatar.look(0,0)});addEventListener('pagehide',()=>{controller?.abort();avatar?.destroy()},{once:true});mount();
</script></html>
