<!doctype html><meta charset="utf-8"><title>Q73交叉像素定位</title><style>body{margin:0;background:#ddd}canvas{display:block}</style><canvas width="1100" height="800"></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),im=new Image;im.onload=()=>{x.fillStyle='#ddd';x.fillRect(0,0,1100,800);x.imageSmoothingEnabled=false;x.drawImage(im,95,490,110,80,0,0,1100,800);x.strokeStyle='#188abc88';x.fillStyle='#042f4a';x.font='16px monospace';for(let i=5;i<110;i+=10){x.beginPath();x.moveTo(i*10,0);x.lineTo(i*10,800);x.stroke();x.fillText(95+i,i*10+2,20)}for(let y=0;y<80;y+=10){x.beginPath();x.moveTo(0,y*10);x.lineTo(1100,y*10);x.stroke();x.fillText(490+y,2,y*10+17)}window.ready=true};im.src='rendered-layers/rear-hair.png';</script>
