<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Q73 独立发束源检查</title><style>body{background:#18212c;color:#eee;font:16px system-ui;margin:20px}main{max-width:1100px;margin:auto}label,button{margin:6px;padding:10px;background:#344151;color:white;display:inline-block}canvas{width:100%;height:auto}p{line-height:1.6}</style><main><h1>Q73 · 独立发束源检查</h1><p>65层候选。下方位移仅用于暴露遮挡补绘，不是模型绑定或物理演示；正式候选尚未验收。</p><label><input id="base" type="checkbox">查看原64层</label><label><input id="hide" type="checkbox">隐藏独立S发束</label><label>局部检查位移 <input id="shift" type="range" min="-8" max="8" step="1" value="0"></label><button id="reset">复位</button><button id="zoom">全身</button><canvas></canvas></main><script type="module">
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),s=document.createElement('canvas');s.width=1070;s.height=1470;const sc=s.getContext('2d');let full=false;
async function load(file){const j=await(await fetch(file)).json();return Promise.all(j.layers.map(l=>new Promise((resolve,reject)=>{const image=new Image;image.onload=()=>resolve({...l,image});image.onerror=reject;image.src=l.file})));}
const[original,candidate]=await Promise.all([load('mouth-rig-raster.json'),load('hair-crossing-raster.json')]);
function draw(){sc.clearRect(0,0,1070,1470);const isBase=document.querySelector('#base').checked,hide=document.querySelector('#hide').checked,shift=+document.querySelector('#shift').value;for(const l of isBase?original:candidate){if(l.id==='rear-hair-left-lock'&&hide)continue;sc.drawImage(l.image,l.x+(l.id==='rear-hair-left-lock'?shift:0),l.y);}c.width=full?1070:1100;c.height=full?1470:700;ctx.fillStyle='#e9e3dc';ctx.fillRect(0,0,c.width,c.height);if(full)ctx.drawImage(s,0,0);else ctx.drawImage(s,65,440,240,180,0,0,1100,700);}
for(const id of ['base','hide','shift'])document.querySelector('#'+id).oninput=draw;
document.querySelector('#reset').onclick=()=>{document.querySelector('#base').checked=document.querySelector('#hide').checked=false;document.querySelector('#shift').value=0;draw()};document.querySelector('#zoom').onclick=e=>{full=!full;e.target.textContent=full?'交叉特写':'全身';draw()};
window.hairSplitReview={capture:()=>s.toDataURL(),draw};draw();window.ready=true;
</script></html>
