<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STARUSH | 星光居所</title>  <script type="module" crossorigin src="./assets/companion-C4Vt18es.js"></script>

<body><main id="home"><canvas id="scene" aria-label="星光居所" tabindex="0"></canvas>
