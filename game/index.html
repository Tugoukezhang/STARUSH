  <script id="game-style-recovery-bootstrap">
    (() => {
      // Styles may fail before the body recovery surface has been created.
      window.starushStyleLoadFailed = false;
      window.addEventListener('error', event => {
        if (event.target?.tagName !== 'LINK' || event.target.rel !== 'stylesheet') return;
        window.starushStyleLoadFailed = true;
        window.starushLoading?.fail();
      }, true);
    })();
  </script>
  <script id="first-visit-preview-preload">
    (() => {
      let started = false;
      window.starushFirstBattlePreload = root => {
        if (started || root?.dataset?.page !== 'desk' || !root.querySelector('[data-action="start"]')) return;
        started = true;
        let disposed = false;
        const eligible = () => !navigator.connection?.saveData
          && root.dataset.cast !== 'owner-three'
          && ![...new URLSearchParams(location.search).keys()].some(key => key !== 'build')
          && localStorage.getItem('starush.public-profile') === null;
        const dispose = () => {
          disposed = true;
          root.removeEventListener('load', check, true);
          root.removeEventListener('error', check, true);
        };
        const check = () => {
          if (disposed) return;
          try {
            const images = [...root.querySelectorAll('img')];
            if (images.some(image => image.complete && !image.naturalWidth)) { dispose(); return; }
            if (images.some(image => !image.complete)) return;
            dispose();
            if (!root.isConnected || root.dataset.page !== 'desk' || !eligible()) return;
            // Visible desk art has priority; only then hint this first battle's banks.
            for (const bank of ['sakura-refined-20261006', 'sakura-oblique-20261006']) {
              for (const file of ['parts.webp', 'views.json']) {
                const link = document.createElement('link');
                link.rel = 'preload'; link.as = file.endsWith('.webp') ? 'image' : 'fetch';
                if (link.as === 'fetch') link.crossOrigin = 'anonymous';
                link.fetchPriority = 'low'; link.href = `art/${bank}/${file}`;
                document.head.append(link);
              }
            }
          } catch { dispose(); }
        };
        try {
          if (!eligible()) return;
          root.addEventListener('load', check, true);
          root.addEventListener('error', check, true);
          check();
          return dispose;
        } catch { dispose(); /* Normal scene loading remains responsible for recovery. */ }
      };
    })();
  </script>

        <div class="mihoyo-portrait cw-portrait" aria-hidden="true"></div>

          <div class="mihoyo-name">绯樱</div>

            <div class="hp-pip" id="hp-1"></div>
            <div class="hp-pip" id="hp-2"></div>
            <div class="hp-pip" id="hp-3"></div>
            <div class="hp-pip" id="hp-4"></div>
            <div class="hp-pip" id="hp-5"></div>
          </div>
        </div>
      </div>
      <div class="heat-card">
        <span id="heat-level">应援等级 Lv.1</span>
        <div id="heat-gauge"><div id="heat-fill"></div></div>
        <div id="support-gauge"><div id="support-gauge-fill"></div></div>
      </div>
      <div class="mihoyo-skills">
        <button type="button" class="skill-orb ult" id="skill-encore"><span id="encore-label">安可</span><span id="encore-state"></span></button>
        <button type="button" class="skill-orb special" id="skill-special" aria-label="绯樱：领唱扇奏"><span id="special-label">扇奏</span><span id="special-fill"></span><span id="special-state"></span></button>
      </div>
      <div class="atmosphere-bar">
        <div class="atmo-dot pink" id="atmo-pink"></div>
        <div class="atmo-dot blue" id="atmo-blue"></div>
        <div class="atmo-dot yellow" id="atmo-yellow"></div>
        <div class="atmo-dot purple" id="atmo-purple"></div>
        <div class="atmo-dot orange" id="atmo-orange"></div>
      </div>
      <span id="support-text">0</span>
    </div>
    <button type="button" id="ult-prompt">释放安可!</button>
    <div id="ult-cutin">
      <img loading="lazy" alt="" />
      <div class="ult-call">释放安可!</div>
    </div>
    <div id="combo-display" style="display:none"></div>
    <div id="encore-indicator" style="display:none">安可</div>
    <div id="center-stage-indicator" style="display:none">C位</div>
    <div id="form-display" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;">
      <span id="form-text">🎤 输出</span>
    </div>
  </div>
  <script id="game-loading-bootstrap">
    (() => {
      const root = document.getElementById('game-loading');
      const message = document.getElementById('game-loading-message');
      const retry = document.getElementById('game-loading-retry');
      const game = document.getElementById('game-container');
      const heading = document.getElementById('game-loading-title');
      const meter = document.getElementById('game-loading-progress');
      const detail = document.getElementById('game-loading-detail');
      const presentation = (title, showProgress, showDetail) => {
        if (heading) heading.textContent = title;
        if (meter) meter.hidden = !showProgress;
        if (detail) detail.hidden = !showDetail;
      };
      let timer, failed = false, retryAction = null, retrying = false;
      const clear = () => clearTimeout(timer);
      const start = () => {
        retryAction = null; retrying = false; retry.textContent = '重新加载';
        if (window.starushStyleLoadFailed) { fail(); return; }
        clear(); failed = false; root.hidden = false; root.dataset.state = 'loading'; game.inert = true; retry.hidden = true;
        presentation('舞台准备', true, false); meter?.removeAttribute('value');
        message.textContent = '正在准备舞台…';
        timer = setTimeout(() => { presentation('载入时间较长', true, true); message.textContent = '载入时间较长，请检查网络后重试。'; retry.hidden = false; }, 20000);
      };
      const fail = action => { clear(); failed = true; retrying = false;
        retryAction = !window.starushStyleLoadFailed && typeof action === 'function' ? action : null;
        retry.textContent = retryAction ? '重试舞台' : '重新加载';
        root.hidden = false; root.dataset.state = 'error'; game.inert = true;
        presentation('舞台载入中断', false, true);
        message.textContent = '舞台未能载入，请检查网络后重试。'; retry.hidden = false; retry.focus?.({preventScroll:true}); };
      window.starushLoading = {
        start, fail,
        hold(text, retryable = false) { clear(); failed = true; root.hidden = false; root.dataset.state = 'session'; game.inert = true;
          retryAction = null; retrying = false; retry.textContent = '重新加载';
          presentation(retryable ? '暂时无法进入' : '等待另一页面', false, retryable);
          message.textContent = text; retry.hidden = !retryable; if(retryable)retry.focus?.({preventScroll:true}); },
        progress(value) { if (!failed && Number.isFinite(value)) { const percent=Math.round(Math.max(0, Math.min(1, value)) * 100); if(meter)meter.value=percent; message.textContent = `舞台准备中 ${percent}%`; } },
        ready() { clear(); if (failed) return; retryAction = null; root.hidden = true; root.dataset.state = 'ready'; if(meter)meter.hidden=true; game.inert = document.getElementById('portrait-protection')?.hidden === false; }
      };
      retry.addEventListener('click', () => {
        if (retrying) return;
        retrying = true; retry.hidden = true;
        const action = retryAction; retryAction = null;
        try { if (action && action() !== false) return; } catch { /* Keep the boot-level recovery fallback. */ }
        window.location.reload();
      });
      window.addEventListener('error', event => {
        if(event.target?.tagName==='IMG'&&root.contains?.(event.target)){event.target.hidden=true;return;}
        if (event.target?.tagName === 'SCRIPT' && event.target.type === 'module') fail();
      }, true);
      for(const image of root.querySelectorAll?.('img')||[]){if(image.complete&&image.naturalWidth===0)image.hidden=true;}
      start();
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
